<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Accede a tu cuenta de cliente Aroma Cafe." />
  <title>Acceso | Aroma Cafe</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">Aroma Cafe</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="menu.html">Menu</a></li>
          <li><a href="login.html">Acceso</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>
  <main class="form-section">
    <div class="form-card">
      <h1>Bienvenido de vuelta</h1>
      <p class="subtitle">Inicia sesion para acceder a tu cuenta Aroma Cafe.</p>
      <form id="login-form" action="#" method="post" novalidate>
        <div class="form-group">
          <label for="login-email">Correo electronico</label>
          <input type="email" id="login-email" name="email" placeholder="tu@correo.mx" required />
        </div>
        <div class="form-group">
          <label for="login-password">Contrasena</label>
          <input type="password" id="login-password" name="password" placeholder="secreta" required />
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;">Iniciar Sesion</button>
      </form>
      <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--color-muted);">
        No tienes cuenta? <a href="#">Registrate gratis</a>
      </p>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>(c) 2024 Aroma Cafe.</p>
    </div>
  </footer>
</body>
</html>
