<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Accede a tu cuenta de cliente Aroma Café para gestionar tus pedidos y recompensas." />
  <title>Acceso | Aroma Café</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo">☕ Aroma Café</a>
      <nav class="main-nav">
        <ul>
          <li><a href="index.html">Inicio</a></li>
          <li><a href="menu.html">Menú</a></li>
          <li><a href="login.html">Acceso</a></li>
          <li><a href="contact.html">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="form-section">
    <div class="form-card">
      <h1>☕ Bienvenido de vuelta</h1>
      <p class="subtitle">Inicia sesión para acceder a tu cuenta Aroma Café.</p>

      <form id="login-form" action="#" method="post" novalidate>
        <div class="form-group">
          <label for="login-email">Correo electrónico</label>
          <input
            type="email"
            id="login-email"
            name="email"
            placeholder="tu@correo.mx"
            autocomplete="email"
            required
          />
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input
            type="password"
            id="login-password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
        </div>
        <div class="form-group" style="flex-direction:row; justify-content:space-between; align-items:center;">
          <label style="flex-direction:row; align-items:center; gap:0.4rem; cursor:pointer;">
            <input type="checkbox" id="remember-me" name="remember" />
            <span style="color:var(--color-muted); font-size:0.9rem;">Recordarme</span>
          </label>
          <a href="#" style="font-size:0.88rem;">¿Olvidaste tu contraseña?</a>
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;">
          Iniciar Sesión
        </button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; font-size:0.9rem; color:var(--color-muted);">
        ¿No tienes cuenta? <a href="#">Regístrate gratis</a>
      </p>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2024 Aroma Café. Todos los derechos reservados.</p>
      <p>📞 <span id="footer-phone">(614) 555-0199</span> &nbsp;|&nbsp; ✉️ hola@aromacafe.mx</p>
    </div>
  </footer>

</body>
</html>
